[workspace]
members = ["crates/samml-core", "crates/samml-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
description = "San Andreas Mod Manager for Linux players."
edition = "2024"
repository = "https://github.com/javidahmed64592/samml"
homepage = "https://github.com/javidahmed64592/samml"
license = "MIT"
authors = ["Javid Ahmed <javidahmed@icloud.com>"]

[workspace.dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3"
samml-core = { path = "crates/samml-core" }

[profile.dist]
inherits = "release"
lto = "thin"
